# Local dev Postgres for the backend's persistent canvases (backend/src/canvases).
# One-time setup: `docker compose up -d`. Not part of `npm run dev` — this is a
# persistent stateful service, not a per-session dev process like the backend/frontend.
services:
  postgres:
    image: postgres:16-alpine
    environment:
      POSTGRES_USER: lattice
      POSTGRES_PASSWORD: lattice
      POSTGRES_DB: lattice
    ports:
      - "5432:5432"
    volumes:
      - lattice-postgres-data:/var/lib/postgresql/data

volumes:
  lattice-postgres-data:
